name: Windows build
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'data/**'
      - 'audio/**/*.wav'
      - 'cmake/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'buildspec.json'
      - '.gitignore'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check source package
        run: python scripts/check-package.py
      - name: Build and package
        shell: pwsh
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration Release -Package
      - uses: actions/upload-artifact@v7
        with:
          path: release/obs-companion-windows-x64.zip
          archive: false
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, reminder-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: obs-companion-windows-x64.zip
          path: release
          skip-decompress: true
      - name: Verify and attach release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$(jq -r .version buildspec.json)"
          zip=release/obs-companion-windows-x64.zip
          unzip -t "$zip"
          unzip -Z1 "$zip" | grep -Fx 'obs-companion.dll'
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already public."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" "$zip" --clobber
          else
            gh release create "$RELEASE_TAG" "$zip" --verify-tag --draft --title "OBS Companion $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
  reminder-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-package.py
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/reminder-test.cpp -o /tmp/reminder-test && /tmp/reminder-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/watchdog-test.cpp -o /tmp/watchdog-test && /tmp/watchdog-test
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/sound-preset-test.cpp -o /tmp/sound-preset-test && /tmp/sound-preset-test
